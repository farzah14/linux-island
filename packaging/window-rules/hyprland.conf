# Hyprland >= 0.40 windowrulev2 rules (also compatible with 0.4x/0.5x series)
windowrulev2 = float,class:^(linux-island-ui)$
windowrulev2 = pin,class:^(linux-island-ui)$
windowrulev2 = noborder,class:^(linux-island-ui)$
windowrulev2 = noanim,class:^(linux-island-ui)$
windowrulev2 = noinitialfocus,class:^(linux-island-ui)$
windowrulev2 = noshadow,class:^(linux-island-ui)$
# Keep top-center placement under XWayland even with tiling layouts
windowrulev2 = move (monitor_w-window_w)/2 8,class:^(linux-island-ui)$
