<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Linux Island — Obsidian Emerald Design System Preview</title>
<desc id="desc">Vector design preview showing Obsidian Emerald dark mode, Cool Mist light mode, pill capsules, expanded telemetry/media card, and core palette swatches.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE0E2"/><stop offset="1" stop-color="#E6EAEC"/></linearGradient>
<linearGradient id="emeraldGlow" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#102B17" stop-opacity="0.85"/><stop offset="1" stop-color="#0B0B0B" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-25%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.20"/></filter>
</defs>
